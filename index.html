<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2F0E7">
<meta name="color-scheme" content="light only">
<!-- ホーム画面に追加でアプリのように開く（2026/11/25）。start_url は書かない＝開いたURL（専用リンク）のまま登録される -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="百舌鳥FC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>百舌鳥FC</title>
<style>
  /* 受け口ページ：コーチ用・保護者用ページ（Google Apps Script）を画面いっぱいに埋め込み、
     Google の「このアプリケーションは…」の表示を出さないためのページ（2026/11/25） */
  html,body{margin:0;height:100%;background:#F2F0E7;color:#13221F;
    font-family:"Hiragino Sans","Yu Gothic",sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block}
  .msg{max-width:420px;margin:0 auto;padding:80px 24px;line-height:1.8;text-align:center}
  .msg b{display:block;font-size:18px;margin-bottom:8px}
  /* 起動画面：Google の読み込みが終わるまで表示（中身から mozu-ready が届いたら消す） */
  #splash{position:fixed;inset:0;z-index:5;background:#163A33;color:#F5F3EA;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease,transform .45s ease}
  #splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
  /* ロゴ（百舌鳥）が右上から羽ばたきながら飛んできて、真ん中でふわっと止まる。
     ロゴを左の翼・右の翼・胴体の3枚に切り分け、翼だけを動かして羽ばたかせる */
  #splash .bird{position:relative;width:170px;aspect-ratio:344/296;animation:fly 1.6s cubic-bezier(.25,.8,.3,1) both}
  #splash .bird img{position:absolute;inset:0;width:100%;height:100%;display:block}
  #splash .bird .wl{clip-path:polygon(0 0,37.2% 0,37.2% 24.3%,30.8% 32.4%,28.5% 50.7%,0 50.7%);transform-origin:37.2% 28.7%;animation:flapL .26s ease-in-out 6 both}
  #splash .bird .wr{clip-path:polygon(57.6% 0,100% 0,100% 50.7%,73.3% 50.7%,73.3% 33.8%,57.6% 24.3%);transform-origin:57.6% 28.7%;animation:flapR .26s ease-in-out 6 both}
  /* 翼の付け根（動かない）：翼が動いたときにできるすき間を、元の絵で埋める */
  #splash .bird .wlb{clip-path:polygon(22.7% 0,37.2% 0,37.2% 24.3%,30.8% 32.4%,28.5% 50.7%,14% 50.7%,16.3% 32.4%,22.7% 24.3%)}
  #splash .bird .wrb{clip-path:polygon(57.6% 0,72.1% 0,72.1% 24.3%,87.8% 33.8%,87.8% 50.7%,73.3% 50.7%,73.3% 33.8%,57.6% 24.3%)}
  #splash .bird .bd{clip-path:polygon(37.2% 0,57.6% 0,57.6% 24.3%,73.3% 33.8%,73.3% 50.7%,100% 50.7%,100% 100%,0 100%,0 50.7%,28.5% 50.7%,30.8% 32.4%,37.2% 24.3%)}
  #splash .shadow{width:110px;height:10px;margin-top:-8px;border-radius:50%;background:rgba(0,0,0,.28);animation:shadow 1.6s cubic-bezier(.25,.8,.3,1) both}
  #splash .name{font-size:28px;font-weight:800;letter-spacing:.14em;animation:rise .7s 1.25s cubic-bezier(.2,.8,.2,1) both}
  #splash .name b{font-weight:800;margin-left:.3em}
  #splash .dots{display:flex;gap:7px;animation:rise .6s 1.5s both}
  #splash .dots i{width:7px;height:7px;border-radius:50%;background:#C7A46C;opacity:.35;animation:dot 1.2s ease-in-out infinite}
  #splash .dots i:nth-child(2){animation-delay:.15s} #splash .dots i:nth-child(3){animation-delay:.3s}
  @keyframes flapL{0%,100%{transform:none}30%{transform:rotate(20deg) scaleY(.92)}70%{transform:rotate(-14deg)}}
  @keyframes flapR{0%,100%{transform:none}30%{transform:rotate(-20deg) scaleY(.92)}70%{transform:rotate(14deg)}}
  @keyframes fly{
    0%{transform:translate(48vw,-46vh) rotate(-14deg) scale(.55);opacity:0}
    12%{opacity:1}
    55%{transform:translate(10vw,-10vh) rotate(-6deg) scale(.85)}
    80%{transform:translate(0,6px) rotate(2deg) scale(1)}
    90%{transform:translate(0,-6px) rotate(0)}
    100%{transform:none}}
  @keyframes shadow{0%,40%{transform:scale(.2);opacity:0}80%,100%{transform:scale(1);opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes dot{0%,100%{opacity:.3;transform:none}50%{opacity:1;transform:translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="bird"><img class="bd" src="crest-thin.png" alt="百舌鳥FC"><img class="wlb" src="crest-thin.png" alt=""><img class="wrb" src="crest-thin.png" alt=""><img class="wl" src="crest-thin.png" alt=""><img class="wr" src="crest-thin.png" alt=""></div>
  <div class="shadow"></div>
  <div class="name">百舌鳥<b>FC</b></div>
  <div class="dots"><i></i><i></i><i></i></div>
</div>
<script>
"use strict";
// コーチ用ウェブアプリのURL（デプロイ「コーチ用」の /exec。保護者用も同じURL）
const EXEC = "https://script.google.com/macros/s/AKfycbw6OtUz0_V8m0GPFOxDcXW4wJPEElu6BhcdzCUdAUHnVh8YWm5kNILUFV8xGFXfoXCh/exec";

(function () {
  const splash = document.getElementById("splash"), t0 = Date.now();
  // 起動画面を消す（鳥が飛んできて文字が出るまで、最低2秒は見せる）
  const hide = () => { setTimeout(() => { splash.classList.add("out"); setTimeout(() => splash.remove(), 500); }, Math.max(0, 2000 - (Date.now() - t0))); };
  const q = new URLSearchParams(location.search);
  // 合言葉は英数字・-・_ だけを通す（それ以外は付け足さない）
  const clean = v => String(v || "").replace(/[^A-Za-z0-9_-]/g, "");
  let k = clean(q.get("k")), f = clean(q.get("f"));
  // ホーム画面のアイコンから開いたときに合言葉が付いていない場合に備え、この端末に最後の専用リンクを覚えておく
  try {
    if (k || f) localStorage.setItem("mozu-link", JSON.stringify({ k, f }));
    else { const m = JSON.parse(localStorage.getItem("mozu-link") || "{}"); k = clean(m.k); f = clean(m.f); }
  } catch (e) {}
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(EXEC) || (!k && !f)) {
    splash.remove();
    document.body.innerHTML = '<div class="msg"><b>ページを開けませんでした</b>' +
      'お送りした専用リンクから開いてください。<br>うまく開けないときは運営までご連絡ください。</div>';
    return;
  }
  window.addEventListener("message", e => {
    if (e.data === "mozu-ready" && (e.origin === "null" || /^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(e.origin))) hide();
  });
  setTimeout(hide, 15000); // 合図が届かなくても15秒で消す
  const fr = document.createElement("iframe");
  fr.src = EXEC + (f ? "?f=" + encodeURIComponent(f) : "?k=" + encodeURIComponent(k));
  fr.title = f ? "保護者用ページ" : "コーチ用ページ";
  fr.allow = "clipboard-write; fullscreen";
  fr.referrerPolicy = "no-referrer";
  document.title = f ? "百舌鳥FC 保護者用ページ" : "百舌鳥FC コーチ用ページ";
  document.body.appendChild(fr);
})();
</script>
</body>
</html>
