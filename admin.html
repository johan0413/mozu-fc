<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ホーム画面に追加でアプリのように開く（2026/11/25） -->
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FC運営">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2F0E7">
<meta name="color-scheme" content="light only">
<title>コーチ運営ボード</title>
<style>
  /* 運営用の受け口ページ：運営画面（Google Apps Script・Googleアカウントでログイン）を埋め込み、
     Google の「このアプリケーションは…」の表示を出さないためのページ（2026/11/25） */
  html,body{margin:0;height:100%;background:#F2F0E7;color:#13221F;
    font-family:"Hiragino Sans","Yu Gothic",sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block}
  #help{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:none;
    background:#163A33;color:#F5F3EA;border-radius:14px;padding:12px 16px;font-size:14px;line-height:1.7;
    box-shadow:0 8px 24px rgba(19,34,31,.25);max-width:92vw;z-index:2}
  #help a{color:#C7A46C;font-weight:700}
  #help button{margin-left:8px;border:0;background:transparent;color:#F5F3EA;font-size:14px;cursor:pointer}
  /* 起動画面：Google の読み込みが終わるまで表示（中身から mozu-ready が届いたら消す） */
  #splash{position:fixed;inset:0;z-index:5;background:#163A33;color:#F5F3EA;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease,transform .45s ease}
  #splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
  /* ロゴ（百舌鳥）が右上から羽ばたきながら飛んできて、真ん中でふわっと止まる。
     ロゴを左の翼・右の翼・胴体の3枚に切り分け、翼だけを動かして羽ばたかせる */
  #splash .bird{position:relative;width:170px;aspect-ratio:344/296;animation:fly 1.6s cubic-bezier(.25,.8,.3,1) both}
  #splash .bird img{position:absolute;inset:0;width:100%;height:100%;display:block}
  #splash .bird .wl{clip-path:polygon(0 0,37.2% 0,37.2% 24.3%,30.8% 32.4%,28.5% 50.7%,0 50.7%);transform-origin:37.2% 28.7%;animation:flapL .26s ease-in-out 6 both}
  #splash .bird .wr{clip-path:polygon(57.6% 0,100% 0,100% 50.7%,73.3% 50.7%,73.3% 33.8%,57.6% 24.3%);transform-origin:57.6% 28.7%;animation:flapR .26s ease-in-out 6 both}
  #splash .bird .bd{clip-path:polygon(37.2% 0,57.6% 0,57.6% 24.3%,73.3% 33.8%,73.3% 50.7%,100% 50.7%,100% 100%,0 100%,0 50.7%,28.5% 50.7%,30.8% 32.4%,37.2% 24.3%)}
  #splash .shadow{width:110px;height:10px;margin-top:-8px;border-radius:50%;background:rgba(0,0,0,.28);animation:shadow 1.6s cubic-bezier(.25,.8,.3,1) both}
  #splash .name{font-size:28px;font-weight:800;letter-spacing:.14em;animation:rise .7s 1.25s cubic-bezier(.2,.8,.2,1) both}
  #splash .name b{font-weight:800;margin-left:.3em}
  #splash .dots{display:flex;gap:7px;animation:rise .6s 1.5s both}
  #splash .dots i{width:7px;height:7px;border-radius:50%;background:#C7A46C;opacity:.35;animation:dot 1.2s ease-in-out infinite}
  #splash .dots i:nth-child(2){animation-delay:.15s} #splash .dots i:nth-child(3){animation-delay:.3s}
  @keyframes flapL{0%,100%{transform:none}30%{transform:rotate(24deg) scaleY(.9)}70%{transform:rotate(-16deg)}}
  @keyframes flapR{0%,100%{transform:none}30%{transform:rotate(-24deg) scaleY(.9)}70%{transform:rotate(16deg)}}
  @keyframes fly{
    0%{transform:translate(48vw,-46vh) rotate(-14deg) scale(.55);opacity:0}
    12%{opacity:1}
    55%{transform:translate(10vw,-10vh) rotate(-6deg) scale(.85)}
    80%{transform:translate(0,6px) rotate(2deg) scale(1)}
    90%{transform:translate(0,-6px) rotate(0)}
    100%{transform:none}}
  @keyframes shadow{0%,40%{transform:scale(.2);opacity:0}80%,100%{transform:scale(1);opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes dot{0%,100%{opacity:.3;transform:none}50%{opacity:1;transform:translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
  #splash .sub{font-size:13px;letter-spacing:.3em;color:rgba(245,243,234,.75);margin-top:-8px;animation:rise .6s 1.4s both}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="bird"><img class="bd" src="crest-thin.png" alt="百舌鳥FC"><img class="wl" src="crest-thin.png" alt=""><img class="wr" src="crest-thin.png" alt=""></div>
  <div class="shadow"></div>
  <div class="name">百舌鳥<b>FC</b></div>
  <div class="sub">運営ボード</div>
  <div class="dots"><i></i><i></i><i></i></div>
</div>
<div id="help" role="status">
  表示されないときは、Google にログインしていないか、ブラウザが埋め込みを止めています。
  <a id="direct" href="#" target="_top" rel="noopener">運営画面を直接開く</a>
  <button type="button" onclick="this.parentNode.style.display='none'">閉じる</button>
</div>
<script>
"use strict";
// 運営用ウェブアプリのURL（デプロイ「運営用」の /exec）
const EXEC = "https://script.google.com/macros/s/AKfycbxioZ_2Bb402kC94QHbom38t9IjGCeAMWlTKPHkJ1Og0GDVukcvbv8U2YXreJXbgFFA/exec";

(function () {
  const help = document.getElementById("help"), splash = document.getElementById("splash"), t0 = Date.now();
  // 起動画面を消す（鳥が飛んできて文字が出るまで、最低2秒は見せる）
  let gone = false;
  const hide = now => { if (gone) return; gone = true; setTimeout(() => { splash.classList.add("out"); setTimeout(() => splash.remove(), 500); }, now ? 0 : Math.max(0, 2000 - (Date.now() - t0))); };
  // 直接開くときは ?direct=1 を付ける（付けないと運営画面がこのページへ戻してしまう）
  document.getElementById("direct").href = EXEC + "?direct=1";
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(EXEC)) { hide(true); help.style.display = "block"; return; }
  const fr = document.createElement("iframe");
  fr.src = EXEC;
  fr.title = "コーチ運営ボード";
  fr.allow = "clipboard-write; fullscreen";
  document.body.appendChild(fr);
  // 運営画面が読み込まれると合図（mozu-admin-ready）が届く。20秒たっても届かなければ案内を出す
  let ready = false;
  window.addEventListener("message", e => {
    if (e.data === "mozu-admin-ready" && (e.origin === "null" || /^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(e.origin))) { ready = true; help.style.display = "none"; hide(); }
  });
  setTimeout(() => hide(), 8000); // Google のログイン画面などが出る場合に備え、8秒で起動画面を消す
  setTimeout(() => { if (!ready) { hide(true); help.style.display = "block"; } }, 20000);
})();
</script>
</body>
</html>
